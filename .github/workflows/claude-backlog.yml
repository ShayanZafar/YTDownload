# When the owner answers a decision or comments on a debt issue, Claude acts on it at once, so
# nothing waits for the weekly triage (the owner asked for this on Oct 12, 2026). It follows the
# backlog skill (.claude/skills/backlog/SKILL.md): it records the decision in docs/decisions.md
# (and CLAUDE.md for a standing rule), does the work the answer calls for when it's small and
# clear, runs the repo's check, and opens one pull request on a `backlog/` branch, which Claude
# Code Review reviews and the owner merges. Work too big for
# one pull request is recorded and filed as a `debt` issue. A comment that asks a question gets an
# answer on the issue instead. Comments that Claude sessions post under the owner's account carry
# the "Generated by [Claude Code]" footer and are ignored, and so are comments by anyone else.
# Runs on the Claude subscription through the CLAUDE_CODE_OAUTH_TOKEN secret; without it the job
# logs a warning and finishes green. Run it by hand for one issue from the Actions tab.
name: Claude Backlog

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number (a decision or debt issue with the owner's answer)
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: claude-backlog-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  act:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.issue.pull_request == null
          && github.event.comment.user.login == github.repository_owner
          && !contains(github.event.comment.body, 'Generated by [Claude Code]')
          && (contains(github.event.issue.labels.*.name, 'decision')
              || contains(github.event.issue.labels.*.name, 'debt')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # `secrets` can't be read in a job-level `if`, so the steps check this copy.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ISSUE: ${{ github.event.issue.number || inputs.issue }}
    steps:
      - name: Skip without a token
        if: env.CLAUDE_CODE_OAUTH_TOKEN == ''
        run: |
          echo "::warning::The CLAUDE_CODE_OAUTH_TOKEN secret is not set, so the backlog run was skipped. Run 'claude setup-token' and 'gh secret set CLAUDE_CODE_OAUTH_TOKEN -R ${{ github.repository }}'."

      - uses: actions/checkout@v7
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        with:
          node-version: 24
          cache: npm

      - name: Install
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        run: npm ci
        env:
          # youtube-dl-exec's installer asks GitHub's API for yt-dlp's latest release; signed in,
          # it isn't refused by the shared runners' rate limit.
          GITHUB_TOKEN: ${{ github.token }}

      - uses: anthropics/claude-code-action@v1
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        env:
          # A CI run ends with Claude's last message, so nothing may run in the background.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          prompt: |
            The owner (${{ github.repository_owner }}) has commented on issue #${{ env.ISSUE }} of ${{ github.repository }}. Read CLAUDE.md and .claude/skills/backlog/SKILL.md, then the issue and all its comments with `gh issue view ${{ env.ISSUE }} --comments`. Comments ending in "Generated by [Claude Code]" are Claude's, not the owner's.

            1. If docs/decisions.md already has a line for #${{ env.ISSUE }} and its work is done or has an open pull request, stop: say so in one line.
            2. Decision issue: if the owner's latest comment answers it (picks an option, or says what to do), follow the skill's "Recording a decision": on a new branch `backlog/decision-${{ env.ISSUE }}` add the line to docs/decisions.md (newest first), and a dated line to CLAUDE.md if it's a standing rule. Then do the work the answer calls for in the same branch when it's small and clear (the skill's S or M), following CLAUDE.md's definition of done: tests first, docs updated. Larger work: record only, and file a `debt` issue for the work that links the decision. For anything outside the code (deleting a branch, say), do it only when the owner's comment says so in so many words, and say what you did.
            3. Debt issue: if the owner's comment says to do it, or changes how, do it per the skill's "Working (one debt item)" on branch `backlog/debt-${{ env.ISSUE }}`, as the comment says. If it says to drop it, close it as not planned with a one-line note.
            4. If the comment is a question or isn't an answer, reply to it on the issue in a few sentences, answering from the code, and change nothing else.
            5. Run the check (npm run verify) until it passes; never skip or loosen a test or check to get green. Commit, push and open a ready-for-review pull request with the repo's PR template: "Implements decision #${{ env.ISSUE }}" or "Fixes #${{ env.ISSUE }}". Then comment on the issue with the pull request's link and what it does, and close a decision issue (completed) once it's recorded. Never merge and never push to the default branch.
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 150
            --allowedTools "Read,Glob,Grep,Edit,MultiEdit,Write,Bash(npm run *),Bash(npx *),Bash(git *),Bash(gh issue *),Bash(gh pr *),Bash(gh api *),Bash(wc *),Bash(head *),Bash(tail *),Bash(sort *)"
            --append-system-prompt "This is a non-interactive CI run that ends with your final message; nothing can resume it. Run every subagent and command in the foreground, wait for each result, and finish only when the work is complete."
