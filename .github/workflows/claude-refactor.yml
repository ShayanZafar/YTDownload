# Once a month, Claude runs the repo's /refactor skill (.claude/skills/refactor):
# it measures complexity, duplication, dead code and churn, applies at most three
# behavior-preserving cleanups with npm run verify passing, and opens a pull
# request. The Claude Code Review workflow then reviews that PR like any other,
# and nothing merges without you. Runs on the Claude subscription through the
# CLAUDE_CODE_OAUTH_TOKEN secret; if the secret is missing or empty, the job
# logs a warning and finishes green. Run it any time from the Actions tab.
name: Claude Refactor

on:
  schedule:
    - cron: "17 13 1 * *" # the 1st of the month, 13:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: read
  id-token: write

concurrency:
  group: claude-refactor
  cancel-in-progress: false

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # youtube-dl-exec's installer looks for Python, which the app doesn't use.
      YOUTUBE_DL_SKIP_PYTHON_CHECK: "1"
      # `secrets` can't be read in a job-level `if`, so the steps check this copy.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - name: Skip without a token
        if: env.CLAUDE_CODE_OAUTH_TOKEN == ''
        run: |
          echo "::warning::The CLAUDE_CODE_OAUTH_TOKEN secret is not set, so the refactor was skipped. Run 'claude setup-token' and 'gh secret set CLAUDE_CODE_OAUTH_TOKEN -R ${{ github.repository }}'."

      - uses: actions/checkout@v7
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        with:
          node-version: 24
          cache: npm

      - name: Install
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        run: npm ci

      - uses: anthropics/claude-code-action@v1
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        env:
          # A CI run ends with Claude's last message, so nothing may run in the background: on
          # Oct 11, 2026 the review plugin started its checks as background subagents, the run
          # ended before they reported back, and the review posted nothing.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/refactor"
          show_full_output: true
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 120
            --allowedTools "Read,Glob,Grep,Edit,MultiEdit,Write,Bash(npm run verify),Bash(npm run check),Bash(npx *),Bash(git *),Bash(gh pr *),Bash(gh issue *),Bash(wc *),Bash(sort *),Bash(uniq *),Bash(head *),Bash(tail *),Bash(xargs *)"
            --append-system-prompt "This is a non-interactive CI run that ends with your final message; nothing can resume it. Run every subagent and command in the foreground, wait for each result, and finish only when the work is complete."
