# Builds the app and puts the ready-to-run result on the `install` branch, which
# PCs install from and update from (docs/run/README.md: "Installing the
# ready-to-run app"). Runs once the Tests workflow has passed on a push to main
# (or a run of it started by hand or by auto-merge), so PCs only ever get code
# that passed its tests; and by hand from the Actions tab (Run workflow). A
# build of a commit that's no longer main's newest is skipped: the newer one's
# own tests will build it.
#
# The branch holds the built app (dist/), what npm needs to install the
# packages it runs with (package.json, package-lock.json, and
# scripts/yt-dlp.mjs and scripts/ffmpeg-check.mjs, which run after the install), the Windows and Unix scripts, and
# scripts/install/'s README, .gitignore and Start/Stop/Update shortcuts (.cmd for Windows,
# .command for macOS, .sh for Linux).
# Not yt-dlp or ffmpeg: each PC downloads its own when it installs the
# packages. Each build replaces the one before (the branch keeps a single
# commit, so it stays small), which is why Update.cmd fetches it rather than
# merging it.
name: Install branch

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# A newer build replaces one that's still running.
concurrency:
  group: install-branch
  cancel-in-progress: true

env:
  # The commit to build: the one the tests passed on, or main's newest when run by hand.
  BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  # Tests passed on that commit (not the weekly run), and it's still main's newest.
  newest:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Still main's newest commit?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          newest=$(gh api "repos/$REPO/commits/main" --jq .sha)
          if [ "$newest" = "$BUILD_SHA" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "main is at $newest now, not $BUILD_SHA: its own tests will build it."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: newest
    if: needs.newest.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_SHA }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Building needs no yt-dlp or ffmpeg, so their downloads are skipped.
      - name: Install the build tools
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Put the ready-to-run app together
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/install"
          mkdir -p "$out/scripts"
          cp -R dist package.json package-lock.json .env.example .gitattributes "$out/"
          cp -R scripts/windows "$out/scripts/windows"
          cp -R scripts/unix "$out/scripts/unix"
          cp scripts/yt-dlp.mjs scripts/ffmpeg-check.mjs "$out/scripts/"
          cp scripts/install/Start.cmd scripts/install/Stop.cmd scripts/install/Update.cmd scripts/install/.gitignore "$out/"
          cp scripts/install/Start.command scripts/install/Stop.command scripts/install/Update.command "$out/"
          cp scripts/install/Start.sh scripts/install/Stop.sh scripts/install/Update.sh "$out/"
          # The README, with this build's details filled in.
          node -e '
            const fs = require("fs");
            const { execSync } = require("child_process");
            const values = {
              REPO: process.env.GITHUB_REPOSITORY,
              SHA: process.env.BUILD_SHA,
              SHORT_SHA: process.env.BUILD_SHA.slice(0, 7),
              DATE: new Date().toISOString().slice(0, 10),
              SUBJECT: execSync("git log -1 --format=%s").toString().trim(),
            };
            const template = fs.readFileSync("scripts/install/README.md", "utf8");
            fs.writeFileSync(process.argv[1], template.replace(/\{\{(\w+)\}\}/g, (all, key) => values[key] ?? all));
          ' "$out/README.md"

      - name: Publish it to the install branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          subject="$(git log -1 --format=%s)"
          cd "$RUNNER_TEMP/install"
          git init -q -b install
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build of main ${BUILD_SHA::7}: $subject"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:install
