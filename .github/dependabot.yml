# Monthly dependency updates, grouped into one pull request per ecosystem so
# the Tests workflow checks them together. Security updates still arrive as
# soon as GitHub publishes an advisory.
#
# If a grouped npm update's lockfile won't install, close the PR and run the
# upgrade locally with `npx npm@11 update` instead (see .claude/rules/dependencies.md on npm 10).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 3
    ignore:
      # typescript-eslint only supports the TypeScript majors it was built for
      # (its peer range failed npm ci on TypeScript 7). Bump TypeScript by hand
      # once typescript-eslint catches up; minors and patches still arrive here.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
